name: Release

# Builds the bridge and the page for each architecture and publishes them as a
# GitHub release, which the LXC scripts install. Push a tag that matches the
# version in server/Cargo.toml and package.json, for example v0.4.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -n 1)"
          npm_version="$(node -p 'require("./package.json").version')"
          if [[ "$tag" != "$cargo_version" || "$tag" != "$npm_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match server/Cargo.toml ($cargo_version) and package.json ($npm_version)" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # A static musl binary runs on any Debian release and needs no libc match.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Build the bridge
        working-directory: server
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Each runner builds for its own architecture, so the bridge can be run.
      - name: See that the bridge starts
        run: |
          said="$("server/target/${{ matrix.target }}/release/proxmox-crt" --version)"
          echo "$said"
          [[ "$said" == "proxmox-crt ${GITHUB_REF_NAME#v}" ]]

      - name: Package
        run: |
          dir="proxmox-crt-linux-${{ matrix.arch }}"
          mkdir "$dir"
          install -m 755 "server/target/${{ matrix.target }}/release/proxmox-crt" "$dir/proxmox-crt"
          strip "$dir/proxmox-crt"
          cp -r dist "$dir/client"
          install -m 644 deploy/proxmox-crt.service "$dir/proxmox-crt.service"
          tar -czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: proxmox-crt-linux-${{ matrix.arch }}
          path: proxmox-crt-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum proxmox-crt-linux-*.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            proxmox-crt-linux-*.tar.gz SHA256SUMS
